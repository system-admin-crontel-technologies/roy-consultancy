# Production overrides for the shared VPS (see docs/runbooks/production-vps.md).
# Only the web app is published, and only on loopback for Caddy; the web app reaches
# the API over the compose network through its /api/v1 passthrough.
#   docker compose -f infra/docker/compose.yml -f infra/docker/compose.prod.yml --env-file .env up -d --build
services:
  api:
    ports: !reset []
  web:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8160}:3000"
  rustfs:
    ports: !reset []
  # Captures outgoing mail until real SMTP is configured; UI reachable only via SSH tunnel.
  mailpit:
    ports: !override
      - "127.0.0.1:${MAILPIT_UI_PORT:-8035}:8025"
